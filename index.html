<!doctype html>
<!--
  囤囤の森 — 隨手收藏網路上的影片、文章、貼文
  版本：v1.2.0（2026-11-01）

  更新紀錄（最近三版，完整紀錄見規格檔）
  v1.2.0（2026-11-01）
    【新增】整理面板每個主分類後面多一顆「＋」，點了直接打次分類名稱，不用再打主分類
    【調整】下方輸入框改成「＋ 新增主分類」，點了才出現
  v1.1.0（2026-10-31）
    【新增】長按一則就能分類；分享卡沒有標題時可以順手補一句；每週提醒放超過一個月還沒看的
    【新增】第一次使用的 3 步清單、待整理示範左右滑；電腦「囤一下」小視窗存好自動關
    【調整】底部導覽文字放大
  v1.0.0（2026-10-31）
    【新增】第一版：從其他 App 分享就能存、待整理（左右滑）、糧倉（搜尋與篩選）、嗑一顆（隨機挑一則）
    【新增】多選兩層標籤、看過與心得、看完回來時詢問、貼上多個連結匯入、備份匯出
    【新增】離線也能存；設定 Google 試算表後手機與電腦自動同步
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23314F">
<meta name="description" content="隨手收藏網路上的影片、文章、貼文">
<title>囤囤の森 v1.2.0</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;900&family=Baloo+2:wght@600;800&display=swap">
<style>
:root{
  --night:#23314F; --night2:#33456B; --night3:#1A2540;
  --grain:#F2B630; --grain2:#E2A21C; --grain3:#F7C552;
  --leaf:#4F9D69; --danger:#B4373D;
  --panel:#FAF8F2; --card:#FFFFFF; --line:#EFE9DA; --line2:#E2DBC8;
  --ink:#23314F; --muted:#5B6680; --faint:#7A8399; --chip:#E9ECF3;
  --top-ink:#FAF8F2; --top-muted:#C9D2E6;
  --num:'Baloo 2', 'Noto Sans TC', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --night:#151D30; --night2:#26324F; --night3:#0E1424;
    --panel:#1C2438; --card:#243050; --line:#2E3A57; --line2:#3A4766;
    --ink:#ECEFF6; --muted:#A3ADC4; --faint:#8590A8; --chip:#2E3A57;
  }
}
:root[data-theme="dark"]{
  --night:#151D30; --night2:#26324F; --night3:#0E1424;
  --panel:#1C2438; --card:#243050; --line:#2E3A57; --line2:#3A4766;
  --ink:#ECEFF6; --muted:#A3ADC4; --faint:#8590A8; --chip:#2E3A57;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--top-ink);font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--grain);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;min-height:100dvh}
.scr.on{display:flex}
.top{padding:calc(18px + env(safe-area-inset-top)) 20px 0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.02em}
.top-sub{font-size:13px;color:var(--top-muted);margin-top:4px}
.ver{border:none;background:transparent;color:var(--top-muted);font-size:11px;padding:6px 4px;min-height:32px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--top-muted);border:none;background:transparent;min-height:32px;padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--leaf)} .dot.wait{background:var(--grain)} .dot.bad{background:#E0656B}
.pill-btn{min-height:40px;padding:0 14px;border:none;border-radius:20px;background:var(--grain);color:#23314F;font-weight:900;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill-ghost{min-height:40px;padding:0 14px;border:none;border-radius:20px;background:var(--night2);color:var(--top-ink);font-size:14px}
.panel{flex:1;margin-top:16px;background:var(--panel);color:var(--ink);border-radius:28px 28px 0 0;padding:16px 0 calc(150px + env(safe-area-inset-bottom))}
.hint{font-size:13px;color:var(--muted);padding:0 20px 10px}

/* 待整理：種子堆 */
.pile-wrap{margin:12px 22px 0;display:flex;align-items:flex-end;gap:16px}
.pile{position:relative;width:130px;height:80px;flex:none}
.pile .ground{position:absolute;left:4px;right:4px;bottom:0;height:6px;border-radius:50%;background:var(--night3)}
.seed{position:absolute;width:26px;height:20px;border-radius:50%;transition:opacity .3s}
.big-num{font-family:var(--num);font-size:52px;font-weight:800;line-height:.9;color:var(--grain)}

/* 列 */
.row{position:relative;margin:0 12px 10px;border-radius:18px;overflow:hidden}
.row-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:14px;font-weight:900;opacity:0}
.row.go-r .row-bg{opacity:1;background:var(--leaf);color:#fff}
.row.go-l .row-bg{opacity:1;background:var(--grain);color:#23314F}
.row.go-r .bg-l,.row.go-l .bg-r{visibility:hidden}
.bg-r,.bg-l{display:flex;align-items:center;gap:8px}
.row-fg{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;display:flex;gap:12px;align-items:center;padding:10px;min-height:84px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .22s ease}
.row.dragging .row-fg{transition:none}
.row.pressing .row-fg{transform:scale(.97);transition:transform .5s ease}
.row.demo .row-fg{transition:transform .45s ease}
.thumb img{pointer-events:none}
.thumb{position:relative;width:60px;height:60px;border-radius:14px;background:var(--line2);flex:none;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.src{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:900;background:var(--night);color:#FAF8F2;border-radius:6px;padding:1px 5px;z-index:1}
.row-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.row-title{font-size:15px;font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.row-title.empty{color:var(--faint)}
.row-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row.seen .thumb,.row.seen .row-txt{opacity:.62}
.badge-seen{flex:none;background:var(--grain);color:#23314F;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:900}
.tag{font-size:11px;background:var(--chip);color:var(--ink);border-radius:8px;padding:1px 7px}
.note-line{font-size:13px;color:var(--muted);line-height:1.4;border-left:3px solid var(--grain);padding-left:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{display:none;flex:none;width:40px;height:40px;border:none;border-radius:20px;background:transparent;color:var(--muted);align-items:center;justify-content:center}
@media (hover:hover){.more{display:flex}.more:hover{background:var(--line)}}
.empty-box{padding:36px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.empty-box b{color:var(--ink)}

/* 糧倉 */
.search{margin:12px 20px 0;position:relative}
.search svg{position:absolute;left:14px;top:13px}
.search input{width:100%;min-height:44px;border:none;border-radius:22px;padding:0 16px 0 40px;font-size:15px;background:#FAF8F2;color:#23314F}
.chip-row{display:flex;overflow-x:auto;gap:8px;padding:12px 20px 2px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip-top{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:2px solid var(--night2);background:transparent;color:var(--top-ink);font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}
.chip-top.on{background:var(--grain);border-color:var(--grain);color:#23314F}
.chip-top small{font-family:var(--num);font-size:13px;font-weight:600;opacity:.8}
.sub-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;gap:8px}
.seg{display:flex;background:var(--line);border-radius:18px;padding:3px}
.seg button{min-height:34px;padding:0 12px;border:none;border-radius:15px;background:transparent;color:var(--ink);font-size:13px}
.seg button.on{background:var(--card);font-weight:900}
.link-btn{min-height:34px;border:none;background:transparent;color:var(--muted);font-size:13px}
.show-more{display:block;margin:6px auto 0;min-height:44px;padding:0 20px;border:2px solid var(--line2);border-radius:22px;background:transparent;color:var(--ink)}

/* 標籤 chip（面板裡） */
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:2px solid var(--line2);background:var(--card);color:var(--ink);font-size:14px}
.chip.l1{font-weight:900;min-height:44px;padding:0 16px;border-radius:22px;font-size:15px}
.chip.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:18px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip.part{background:var(--chip);border-color:var(--ink)}
.chip.dash{border-style:dashed;background:transparent;color:var(--muted)}
.kid-plus{min-width:40px;padding:0;font-size:18px;line-height:1}
.kid-add{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--leaf);border-radius:18px;padding:0 4px 0 12px;min-height:40px;background:var(--card)}
.kid-in{width:7.5em;border:none;background:transparent;font-size:14px;color:var(--ink);min-height:34px;outline:none}
.kid-ok{min-height:32px;padding:0 10px;border:none;border-radius:16px;background:var(--leaf);color:#fff;font-size:13px;font-weight:900}
.kid-x{width:32px;height:32px;border:none;border-radius:16px;background:transparent;color:var(--muted);font-size:14px}

/* 嗑一顆 */
.snack{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 20px calc(110px + env(safe-area-inset-bottom));gap:18px}
.snack-card{width:100%;background:var(--panel);color:var(--ink);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .25s}
.snack-img{position:relative;height:180px;border-radius:18px;background:var(--line2);overflow:hidden}
.snack-img img{width:100%;height:100%;object-fit:cover}
.snack-title{font-size:19px;font-weight:900;line-height:1.4;word-break:break-word}
.snack-age{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.snack-age b{font-family:var(--num);font-size:22px;font-weight:800;color:var(--grain2);line-height:1}
.snack-btns{width:100%;display:flex;gap:10px}
.btn-big{flex:1;min-height:54px;border:none;border-radius:27px;font-size:16px;font-weight:900}
.btn-big.ghost{background:transparent;border:2px solid #4A5D86;color:var(--top-ink)}
.btn-big.grain{flex:1.4;background:var(--grain);color:#23314F}
.toggle-chip{min-height:36px;padding:0 12px;border-radius:18px;border:2px solid var(--night2);background:transparent;color:var(--top-ink);font-size:13px}
.toggle-chip.on{border-color:var(--grain)}

/* 設定 */
.card{margin:0 12px 12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.card h2{margin:0 0 10px;font-size:16px;font-weight:900}
.card p{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.input{min-height:46px;border:2px solid var(--line2);border-radius:14px;padding:0 12px;font-size:15px;background:var(--panel);color:var(--ink);width:100%}
textarea.input{padding:10px 12px;min-height:90px;resize:vertical;line-height:1.5}
.btn{min-height:46px;padding:0 18px;border:none;border-radius:23px;background:var(--ink);color:var(--panel);font-weight:900;font-size:15px}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.line{background:transparent;border:2px solid var(--line2);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;border:2px solid var(--danger);color:var(--danger);font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:52px;padding:8px 14px;margin-bottom:8px;border-radius:16px;border:2px solid var(--line2);background:transparent;color:var(--ink);text-align:left}
.opt b{font-size:15px}
.opt span{font-size:12px;color:var(--muted)}
.opt.on{border-color:var(--ink);background:var(--panel)}
.tag-tree{display:flex;flex-direction:column;gap:10px}
.tt-l1{border:2px solid var(--line);border-radius:14px;padding:10px}
.tt-head{display:flex;align-items:center;gap:6px}
.tt-head b{flex:1;font-size:15px}
.tt-kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tt-kid{display:inline-flex;align-items:center;gap:2px;background:var(--chip);border-radius:16px;padding:0 4px 0 12px;min-height:34px;font-size:13px}
.icon-btn{width:36px;height:36px;border:none;border-radius:18px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.icon-btn:hover{background:var(--line)}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.bookmarklet{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:20px;background:var(--grain);color:#23314F;font-weight:900;text-decoration:none}
.foot{text-align:center;padding:4px 0 20px}

/* 底部導覽 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(496px,calc(100% - 24px));height:60px;background:var(--night);border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);z-index:20;box-shadow:0 0 0 2px var(--night2)}
.tabbar button{border:none;background:transparent;color:var(--top-muted);font-size:15px;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tabbar button.on{color:var(--grain);font-weight:900}
.tab-badge{position:absolute;top:1px;left:calc(50% + 16px);letter-spacing:0;min-width:18px;height:18px;border-radius:9px;background:var(--grain);color:#23314F;font-size:11px;font-weight:900;font-family:var(--num);display:flex;align-items:center;justify-content:center;padding:0 5px}

/* 面板、提示 */
.scrim{position:fixed;inset:0;background:rgba(14,20,36,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(520px,100%);max-height:92dvh;overflow-y:auto;background:var(--panel);color:var(--ink);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-size:17px;font-weight:900;line-height:1.4;word-break:break-word}
.sheet .lbl{font-size:13px;color:var(--muted)}
.groups{display:flex;flex-direction:column;gap:8px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 14px;border:2px solid var(--line2);border-radius:18px;background:var(--card);color:var(--ink);font-size:15px;width:100%}
.track{width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.track i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-pressed="true"] .track{background:var(--leaf)}
.switch[aria-pressed="true"] .track i{left:23px}
.hide{display:none !important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));width:min(496px,calc(100% - 24px));z-index:30;background:var(--night);color:#FAF8F2;border:2px solid var(--leaf);border-radius:22px;padding:8px 8px 8px 18px;display:flex;justify-content:space-between;align-items:center;gap:6px;animation:up .2s ease}
.toast span{font-size:13px;line-height:1.4}
.toast-acts{display:flex;flex:none}
.toast-acts button{min-height:40px;padding:0 10px;border:none;background:transparent;color:var(--grain);font-size:14px;font-weight:900}
.prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));width:min(496px,calc(100% - 24px));z-index:31;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:up .2s ease}
.prompt-btns{display:flex;gap:8px}
.prompt-btns button{flex:1;min-height:44px;border:none;border-radius:22px;font-size:14px;font-weight:900}
.p-seen{background:var(--grain);color:#23314F}
.p-org{background:var(--leaf);color:#fff}
.p-later{background:transparent !important;border:2px solid var(--line2) !important;color:var(--muted);font-weight:500 !important}
/* 新手清單 */
.onb{margin:0 12px 12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px 6px}
.onb-head{display:flex;justify-content:space-between;align-items:center}
.onb-head b{font-size:15px}
.onb-x{min-height:36px;border:none;background:transparent;color:var(--muted);font-size:13px;padding:0 6px}
.onb-step{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 2px;border:none;background:transparent;color:var(--ink);text-align:left}
.onb-step + .onb-step{border-top:1px solid var(--line)}
.onb-no{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:15px;color:var(--muted)}
.onb-step.done .onb-no{background:var(--leaf);border-color:var(--leaf);color:#fff}
.onb-t{flex:1;display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:500}
.onb-t span{font-size:12px;color:var(--muted);font-weight:400}
.onb-step.done .onb-t b{color:var(--muted);text-decoration:line-through;font-weight:500}
.onb-go{flex:none;font-size:13px;font-weight:900;color:var(--leaf)}
/* 每週提醒 */
.nudge{margin:0 12px 12px;background:var(--night);color:#FAF8F2;border-radius:20px;box-shadow:0 0 0 2px var(--grain2);padding:10px 6px 10px 16px;display:flex;align-items:center;gap:10px}
.nudge-n{font-family:var(--num);font-size:30px;font-weight:800;color:var(--grain);line-height:1}
.nudge-t{flex:1;font-size:13px;line-height:1.4}
.nudge .pill-btn{min-height:40px;font-size:13px;padding:0 12px;flex:none}
.nudge-x{flex:none;width:40px;height:40px;border:none;border-radius:20px;background:transparent;color:var(--top-muted);font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">

  <!-- 待整理 -->
  <section class="scr" id="scr-inbox" aria-label="待整理">
    <div class="top">
      <div class="top-row">
        <h1>囤囤の森</h1>
        <div style="display:flex;align-items:center;gap:2px">
          <button class="sync" id="syncBtn" type="button"><span class="dot" id="syncDot"></span><span id="syncText">只存本機</span></button>
          <button class="ver" type="button" data-act="changelog" id="verBtn">v</button>
        </div>
      </div>
      <div class="pile-wrap">
        <div class="pile" role="img" id="pile" aria-label="">
          <div class="ground"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;padding-bottom:4px;flex:1">
          <span class="big-num" id="inboxNum">0</span>

const DAY = 86400000;

  if (sameDay(d, n)) return '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  if (sameDay(d, new Date(n - DAY))) return '昨天';
  if (d.getFullYear() === n.getFullYear()) return (d.getMonth() + 1) + '/' + d.getDate();
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
}
const daysAgo = t => Math.max(0, Math.floor((now() - t) / DAY));

/* ================= 網址 ================= */
const PLATS = [
  [/(^|\.)(youtube\.com|youtu\.be)$/, 'YT', 'YouTube'],
  [/(^|\.)instagram\.com$/, 'IG', 'Instagram'],
  [/(^|\.)(facebook\.com|fb\.watch|fb\.com)$/, 'FB', 'Facebook'],
  [/(^|\.)threads\.(net|com)$/, 'TH', 'Threads'],
  [/(^|\.)(xiaohongshu\.com|xhslink\.com)$/, '紅', '小紅書'],
  [/(^|\.)(twitter\.com|x\.com)$/, 'X', 'X'],
  [/(^|\.)tiktok\.com$/, 'TT', 'TikTok'],
  [/(^|\.)(bilibili\.com|b23\.tv)$/, 'B站', 'bilibili'],
  [/(^|\.)medium\.com$/, 'M', 'Medium'],
  [/(^|\.)github\.com$/, 'GH', 'GitHub']
];
function hostOf(u) { try { return new URL(u).hostname.toLowerCase().replace(/^(www|m|mobile)\./, ''); } catch (e) { return ''; } }
function platOf(u) {
  const h = hostOf(u);
  for (const [re, code, name] of PLATS) if (re.test(h)) return { code, name };
  return { code: '網', name: h || '網頁' };
}
function extractUrls(text) {
  return (String(text || '').match(/https?:\/\/[^\s<>"'，。、「」（）()【】]+/g) || []).map(u => u.replace(/[.,;:!?…]+$/, ''));
}
function normUrl(raw) {
  let u;
  try { u = new URL(raw); } catch (e) { return String(raw || '').trim(); }
  u.hash = '';
  const h = u.hostname.toLowerCase().replace(/^(www|m|mobile)\./, '');
  if (h === 'youtu.be') return 'https://youtube.com/watch?v=' + u.pathname.slice(1).split('/')[0];
  if (/(^|\.)youtube\.com$/.test(h)) {
    const v = u.searchParams.get('v');
    if (v) return 'https://youtube.com/watch?v=' + v;
    const m = u.pathname.match(/^\/(shorts|live|embed)\/([^/?]+)/);
    if (m) return 'https://youtube.com/watch?v=' + m[2];
  }
  const drop = /^(utm_|fbclid|gclid|igshid|igsh|si$|feature$|mibextid|ref$|ref_src|s$|t$|share_|xsec_|app_platform|app_version|apptime|share_from|wechatwid|from$|spm|_branch)/i;
  [...u.searchParams.keys()].forEach(k => { if (drop.test(k)) u.searchParams.delete(k); });
  const q = u.searchParams.toString();
  return 'https://' + h + u.pathname.replace(/\/+$/, '') + (q ? '?' + q : '');
}
function ytId(u) { const m = normUrl(u).match(/youtube\.com\/watch\?v=([\w-]{6,})/); return m ? m[1] : ''; }
const GENERIC_TITLE = /^(instagram|facebook|threads|小红书|小紅書|x|tiktok|youtube|log ?in.*|登入.*|登录.*|sign up.*|error.*|你访问的页面不见了.*)$/i;

  sync: Object.assign({ url: '', key: '', since: 0, dirty: [], dirtySet: [], lastOk: 0, lastErr: '' }, load('tt_sync', {})),
  recent: load('tt_recent', []),

const tagsTree = () => (S.shared.tags && Array.isArray(S.shared.tags.value)) ? S.shared.tags.value : [];

let BATCH = false;

function persistSync() { save('tt_sync', S.sync); }
function markDirty(id) { if (S.sync.dirty.indexOf(id) < 0) S.sync.dirty.push(id); if (!BATCH) persistSync(); }

function putItem(it, quiet) {
  it.updatedAt = now();
  const i = S.items.findIndex(x => x.id === it.id);
  if (i < 0) S.items.push(it); else S.items[i] = it;
  if (!BATCH) persistItems();
  markDirty(it.id);
  scheduleSync();
  if (!quiet) render();
}
function patchItem(id, patch, quiet) {
  const it = byId(id);
  if (!it) return null;
  const before = JSON.parse(JSON.stringify(it));
  putItem(Object.assign({}, it, patch), quiet);
  return before;
}
function restore(before) { if (before) putItem(Object.assign({}, before)); }

function setTags(tree) {
  S.shared.tags = { value: tree, updatedAt: now() };
  save('tt_shared', S.shared);
  if (S.sync.dirtySet.indexOf('tags') < 0) S.sync.dirtySet.push('tags');
  persistSync();
  scheduleSync();
}
function pushRecent(paths) {
  S.recent = paths.concat(S.recent.filter(r => paths.indexOf(r) < 0)).slice(0, 6);
  save('tt_recent', S.recent);
}
function recentTags(n) {
  const all = allPaths();
  const r = S.recent.filter(p => all.indexOf(p) >= 0);
  for (const p of all) { if (r.length >= n) break; if (r.indexOf(p) < 0) r.push(p); }
  return r.slice(0, n);
}
function allPaths() {
  const out = [];
  tagsTree().forEach(t => { out.push(t.n); t.c.forEach(c => out.push(t.n + SEP + c)); });
  return out;
}
function cleanTags(sel) { return sel.filter(p => !(p.indexOf(SEP) < 0 && sel.some(q => q.indexOf(p + SEP) === 0))); }

/** 新增一個連結；回傳 { item, dup } */
function addLink(url, title) {
  const norm = normUrl(url);
  const dup = live().find(x => x.norm === norm);
  if (dup) return { item: dup, dup: true };
  const p = platOf(url);
  const yid = ytId(url);
  const it = {
    id: uid(), url: url, norm: norm, title: (title || '').trim().slice(0, 300), src: p.code,
    thumb: yid ? 'https://i.ytimg.com/vi/' + yid + '/mqdefault.jpg' : '',
    tags: [], seen: false, note: '', savedAt: now(), seenAt: 0, updatedAt: 0, deleted: false
  };
  putItem(it, true);
  queueMeta(it.id);
  return { item: it, dup: false };
}

    steps.map((s, i) => '<button type="button" class="onb-step' + (s.done ? ' done' : '') + '" data-act="onb" data-k="' + s.k + '"' + (s.done ? ' aria-disabled="true"' : '') + '>' +
      '<span class="onb-no">' + (s.done ? '✓' : i + 1) + '</span>' +
      '<span class="onb-t"><b>' + s.t + '</b><span>' + s.d + '</span></span>' +
      (s.done ? '' : '<span class="onb-go">去做 ›</span>') + '</button>').join('') + '</div>';
}

window.addEventListener('appinstalled', () => { ONB.install = true; saveOnb(); render(); });

    sheet('<h3>放好「囤一下」按鈕</h3><div style="font-size:14px;line-height:1.6;color:var(--muted)">把黃色按鈕拖到瀏覽器的書籤列（沒看到書籤列：Ctrl＋Shift＋B）。之後看到想存的網頁，按一下就會跳出小視窗存好、自動關掉。</div>' +
      '<div><a class="bookmarklet" href="' + esc(bookmarkletHref()) + '" onclick="event.preventDefault()">囤一下</a></div>' +
      '<div class="btns"><button type="button" class="btn line" style="flex:1" data-sh="close">等一下</button><button type="button" class="btn leaf" style="flex:1" data-sh="ok">放好了</button></div>', { ok: markDone });

  S.snack.cur = from[Math.floor(Math.random() * from.length)].id;

/* ================= 滑動與點擊 ================= */
let sw = null;
function swipeStart(e) {
  const fg = e.target.closest('.row-fg');
  if (!fg || e.target.closest('button') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const s = sw = { fg: fg, row: fg.parentElement, id: fg.dataset.id, x0: e.clientX, y0: e.clientY, dx: 0, lock: null, pid: e.pointerId };
  // 長按 0.5 秒＝打開整理面板（手機震一下）
  s.row.classList.add('pressing');
  s.lt = setTimeout(() => {
    if (sw !== s || s.lock) return;
    sw = null;
    s.row.classList.remove('pressing');
    try { if (navigator.vibrate) navigator.vibrate(25); } catch (err) { /* 略過 */ }
    openOrganize(s.id);
  }, 500);
}
function stopPress(s) { clearTimeout(s.lt); s.row.classList.remove('pressing'); }
function swipeMove(e) {
  if (!sw || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) stopPress(sw);
  if (!sw.lock) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      sw.lock = 'x';
      try { sw.fg.setPointerCapture(sw.pid); } catch (err) { /* 略過 */ }
      sw.row.classList.add('dragging');
    } else if (Math.abs(dy) > 10) { sw = null; return; }
    else return;
  }
  sw.dx = Math.max(-170, Math.min(170, dx));
  sw.fg.style.transform = 'translateX(' + sw.dx + 'px)';
  sw.row.classList.toggle('go-r', sw.dx > 0);
  sw.row.classList.toggle('go-l', sw.dx < 0);
  const armed = Math.abs(sw.dx) > 90;
  const r = sw.row.querySelector('[data-r]'), l = sw.row.querySelector('[data-l]');
  if (r) r.textContent = armed && sw.dx > 0 ? '放開，' + r.dataset.r : r.dataset.r;
  if (l) l.textContent = armed && sw.dx < 0 ? '放開，' + l.dataset.l : l.dataset.l;
}
function swipeEnd(e) {
  if (!sw || e.pointerId !== sw.pid) return;
  const s = sw; sw = null;
  stopPress(s);
  const mode = s.row.dataset.mode;
  if (s.lock === 'x') {
    s.row.classList.remove('dragging');
    s.fg.style.transform = '';
    setTimeout(() => s.row.classList.remove('go-r', 'go-l'), 220);
    if (s.dx > 90) openOrganize(s.id);
    else if (s.dx < -90) {
      if (mode === 'gran' && byId(s.id) && byId(s.id).seen) unSeen(s.id);
      else quickSeen(s.id);
    }
    return;
  }
  if (e.type === 'pointerup' && Math.abs(e.clientX - s.x0) < 8 && Math.abs(e.clientY - s.y0) < 8) openLink(s.id);
}
function swipeCancel() {
  if (!sw) return;
  stopPress(sw);
  sw.row.classList.remove('dragging', 'go-r', 'go-l');
  sw.fg.style.transform = '';
  sw = null;
}
['#inboxList', '#granList'].forEach(sel => {
  const el = $(sel);
  el.addEventListener('pointerdown', swipeStart);
  el.addEventListener('pointermove', swipeMove);
  el.addEventListener('pointerup', swipeEnd);
  el.addEventListener('pointercancel', swipeCancel);
  // 長按時不要跳出瀏覽器的選單
  el.addEventListener('contextmenu', e => { if (e.target.closest('.row-fg')) e.preventDefault(); });
  el.addEventListener('keydown', e => {
    const fg = e.target.closest('.row-fg');
    if (fg && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLink(fg.dataset.id); }
  });
});

/* ================= 打開連結與回來詢問 ================= */
function openLink(id) {
  const it = byId(id);

  save('tt_last', { id: id, at: now() });
  window.open(it.url, '_blank', 'noopener');
}
function checkReturn() {
  const last = load('tt_last', null);
  if (!last) return;
  const gap = now() - last.at;
  if (gap < 3000) return;
  localStorage.removeItem('tt_last');
  if (gap > 6 * 3600000) return;

  if (it && !it.deleted) showPrompt(it);
}
function showPrompt(it) {

  $('#promptRoot').innerHTML =
    '<div class="prompt" role="dialog" aria-label="看完了嗎">' +
      '<div style="font-size:14px;line-height:1.5">剛剛看的「' + esc(it.title || '沒有標題的那則') + '」看完了嗎？</div>' +

      '</div></div>';

}
function closePrompt(silent) { $('#promptRoot').innerHTML = ''; }
$('#promptRoot').addEventListener('click', e => {

  if (b.dataset.pa === 'org') openOrganize(id);
});

/* ================= 看過 ================= */
function quickSeen(id) {
  const it = byId(id);
  if (!it) return;
  if (it.seen) { toast('這則已經標過看過了'); return; }
  const before = patchItem(id, { seen: true, seenAt: now() });
  const stays = !(it.tags && it.tags.length);
  const text = stays ? '標成看過，還沒分類，先留著' : '標成看過';
  if (S.pref.noteMode === 'always') { openNote(id); return; }
  const acts = [];
  if (S.pref.noteMode === 'toast') acts.push({ label: '寫心得', fn: () => openNote(id) });
  acts.push({ label: '復原', fn: () => restore(before) });
  toast(text, acts);

let ORG = null;
function chipsHtml(sel, adding, draft) {
  return tagsTree().map(t => {
    const part = sel.some(p => p.indexOf(t.n + SEP) === 0);
    // 每個主分類最後一顆「＋」：點了就地輸入次分類，不用再打主分類
    const add = adding === t.n
      ? '<span class="kid-add"><input class="kid-in" id="orgKid" maxlength="12" enterkeyhint="done" value="' + esc(draft || '') + '" placeholder="新的次分類" aria-label="在「' + esc(t.n) + '」底下新增次分類">' +
        '<button type="button" class="kid-ok" data-kidok="' + esc(t.n) + '">加入</button>' +
        '<button type="button" class="kid-x" data-kidx="1" aria-label="取消">✕</button></span>'
      : '<button type="button" class="chip sm dash kid-plus" data-addk="' + esc(t.n) + '" aria-label="在「' + esc(t.n) + '」底下新增次分類">＋</button>';
    return '<div class="group"><button type="button" class="chip l1' + (sel.indexOf(t.n) >= 0 ? ' on' : (part ? ' part' : '')) + '" data-path="' + esc(t.n) + '" aria-pressed="' + (sel.indexOf(t.n) >= 0) + '">' + esc(t.n) + '</button>' +
      t.c.map(c => { const p = t.n + SEP + c; return '<button type="button" class="chip sm' + (sel.indexOf(p) >= 0 ? ' on' : '') + '" data-path="' + esc(p) + '" aria-pressed="' + (sel.indexOf(p) >= 0) + '">' + esc(c) + '</button>'; }).join('') +
      add + '</div>';
  }).join('');
}
function toggleSel(sel, path) {
  if (sel.indexOf(path) >= 0) return sel.filter(p => p !== path);
  const [l1, l2] = splitTag(path);
  let out = l2 ? sel.filter(p => p !== l1) : sel.filter(p => p.indexOf(l1 + SEP) !== 0);
  out.push(path);
  return out;
}
function addTagPath(raw) {
  const txt = String(raw || '').trim().replace(/\s*[\/／>＞]\s*/g, SEP);
  if (!txt) return '';
  let [l1, l2] = splitTag(txt);
  l1 = l1.trim().slice(0, 12); l2 = l2.replace(new RegExp(SEP, 'g'), '').trim().slice(0, 12);
  if (!l1) return '';
  const tree = JSON.parse(JSON.stringify(tagsTree()));
  let t = tree.find(x => x.n === l1);
  if (!t) { t = { n: l1, c: [] }; tree.push(t); }
  if (l2 && t.c.indexOf(l2) < 0) t.c.push(l2);
  setTags(tree);
  return l2 ? l1 + SEP + l2 : l1;
}

/* ================= 匯入、匯出 ================= */
let IMP = [];
function importUrls(urls) {
  let added = 0, dup = 0;
  const seen = {};
  const base = now();
  BATCH = true;
  try {
    urls.forEach((u, i) => {
      const n = normUrl(u);
      if (seen[n]) { dup++; return; }
      seen[n] = 1;
      const r = addLink(u, '');
      if (r.dup) dup++;
      else { added++; r.item.savedAt = base - i; }
    });
  } finally { BATCH = false; }
  persistItems();
  persistSync();
  render();
  toast('匯入 ' + added + ' 則' + (dup ? '，' + dup + ' 則已經存過' : '') + '，都在待整理');
}
function exportBackup() {
  const data = { app: '囤囤の森', version: APP_VERSION, at: new Date().toISOString(), items: S.items, tags: tagsTree() };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = '囤囤の森備份_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let d;
    try { d = JSON.parse(fr.result); } catch (e) { toast('這個檔案讀不懂，確定是囤囤の森的備份嗎？'); return; }
    if (!d || !Array.isArray(d.items)) { toast('檔案裡沒有收藏資料'); return; }
    let n = 0;
    d.items.forEach(x => {
      if (!x || !x.id || !x.url) return;
      const cur = byId(x.id);
      if (cur && (cur.updatedAt || 0) >= (x.updatedAt || 0)) return;
      const it = Object.assign({ tags: [], seen: false, note: '', deleted: false }, x);
      const i = S.items.findIndex(y => y.id === it.id);
      if (i < 0) S.items.push(it); else S.items[i] = it;
      markDirty(it.id);
      n++;
    });
    if (Array.isArray(d.tags)) {
      const tree = JSON.parse(JSON.stringify(tagsTree()));
      d.tags.forEach(t => {
        if (!t || !t.n) return;
        let cur = tree.find(x => x.n === t.n);
        if (!cur) { cur = { n: t.n, c: [] }; tree.push(cur); }
        (t.c || []).forEach(c => { if (cur.c.indexOf(c) < 0) cur.c.push(c); });
      });
      setTags(tree);
    }
    persistItems();
    scheduleSync();
    render();
    toast('從備份匯入 ' + n + ' 則');
  };
  fr.readAsText(file);
}

async function tagAction(act, i, j) {
  const tree = JSON.parse(JSON.stringify(tagsTree()));
  const t = tree[i];
  if (act === 'add') {
    const v = await askText('新增標籤', '', '例如：AI技巧');
    if (!v) return;
    if (tree.some(x => x.n === v)) { toast('已經有「' + v + '」了'); return; }
    tree.push({ n: v, c: [] }); setTags(tree);
  } else if (act === 'addk') {
    const v = await askText('在「' + t.n + '」底下新增細分類', '', '例如：製圖');
    if (!v) return;
    if (t.c.indexOf(v) >= 0) { toast('已經有了'); return; }
    t.c.push(v); setTags(tree);
  } else if (act === 'up' || act === 'down') {
    const k = act === 'up' ? i - 1 : i + 1;
    if (k < 0 || k >= tree.length) return;
    [tree[i], tree[k]] = [tree[k], tree[i]]; setTags(tree);
  } else if (act === 'ren') {
    const v = await askText('「' + t.n + '」改名', t.n);
    if (!v || v === t.n) return;
    if (tree.some(x => x.n === v)) { toast('已經有「' + v + '」了'); return; }
    const old = t.n; t.n = v; setTags(tree);
    retag(tags => tags.map(p => p === old ? v : (p.indexOf(old + SEP) === 0 ? v + p.slice(old.length) : p)));
    S.recent = S.recent.map(p => p === old ? v : (p.indexOf(old + SEP) === 0 ? v + p.slice(old.length) : p)); save('tt_recent', S.recent);
  } else if (act === 'renk') {
    const oldC = t.c[j];
    const v = await askText('「' + oldC + '」改名', oldC);
    if (!v || v === oldC) return;
    if (t.c.indexOf(v) >= 0) { toast('已經有了'); return; }
    t.c[j] = v; setTags(tree);
    const o = t.n + SEP + oldC, nw = t.n + SEP + v;
    retag(tags => tags.map(p => p === o ? nw : p));
  } else if (act === 'del') {
    const n = countUsing(p => p === t.n || p.indexOf(t.n + SEP) === 0);
    const ok = await askConfirm('刪除「' + t.n + '」？', n ? '有 ' + n + ' 則收藏用到它（含細分類），會一起拿掉這個標籤；沒有其他標籤的會回到「待整理」。' : '目前沒有收藏用到它。', '刪除', true);
    if (!ok) return;
    const old = t.n; tree.splice(i, 1); setTags(tree);
    retag(tags => tags.filter(p => p !== old && p.indexOf(old + SEP) !== 0));
  } else if (act === 'delk') {
    const p0 = t.n + SEP + t.c[j];
    const n = countUsing(p => p === p0);
    const ok = await askConfirm('刪除「' + t.c[j] + '」？', n ? '有 ' + n + ' 則收藏用到它，會改成只放在「' + esc(t.n) + '」。' : '目前沒有收藏用到它。', '刪除', true);
    if (!ok) return;
    t.c.splice(j, 1); setTags(tree);
    retag(tags => cleanTags([...new Set(tags.map(p => p === p0 ? t.n : p))]));
  }
  persistItems();
  render();
}

/* ================= 面板與提示 ================= */
let SHEET = null;
function sheet(html, handlers, onClose) {
  const wasOpen = !!SHEET;
  closeSheet(true);
  const root = $('#sheetRoot');
  root.innerHTML = '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
  SHEET = { handlers: handlers || {}, onClose: onClose, prevFocus: document.activeElement };
  const scrim = $('.scrim', root);
  scrim.addEventListener('click', e => {
    if (e.target === scrim) { closeSheet(); return; }
    const b = e.target.closest('[data-sh]');
    if (!b) return;
    const k = b.dataset.sh;
    if (k === 'close') { closeSheet(); return; }
    if (SHEET && SHEET.handlers[k]) SHEET.handlers[k]();
  });
  if (wasOpen && history.state && history.state.sheet) history.replaceState({ sheet: 1 }, '');
  else history.pushState({ sheet: 1 }, '');
}
let ignorePop = 0;
function closeSheet(replacing) {
  if (!SHEET) return;
  const s = SHEET;
  SHEET = null;
  $('#sheetRoot').innerHTML = '';
  if (s.onClose) s.onClose();
  if (!replacing && history.state && history.state.sheet) { ignorePop++; history.back(); }
  if (s.prevFocus && s.prevFocus.focus) try { s.prevFocus.focus(); } catch (e) { /* 略過 */ }
  if (!replacing && popupArmed) setTimeout(popupFinish, 30);
}
// 手機的「返回」鍵：有面板時先關面板
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  if (SHEET) {
    const s = SHEET; SHEET = null; $('#sheetRoot').innerHTML = ''; if (s.onClose) s.onClose();
    if (popupArmed) setTimeout(popupFinish, 30);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SHEET) closeSheet(); });

let toastTimer = null, lastToast = '';
function toast(text, acts, ms) {
  clearTimeout(toastTimer);
  lastToast = text;
  acts = acts || [];
  $('#toastRoot').innerHTML = '<div class="toast"><span>' + esc(text) + '</span><div class="toast-acts">' +
    acts.map((a, i) => '<button type="button" data-ti="' + i + '">' + esc(a.label) + '</button>').join('') + '</div></div>';
  $('#toastRoot').onclick = e => {
    const b = e.target.closest('[data-ti]');
    if (!b) return;
    const a = acts[Number(b.dataset.ti)];
    closeToast();
    if (a) a.fn();
  };
  toastTimer = setTimeout(closeToast, ms || (acts.length ? 5000 : 3000));
}
function closeToast() { clearTimeout(toastTimer); $('#toastRoot').innerHTML = ''; }

/* ================= 同步 ================= */
let syncTimer = null, syncing = false, syncAgain = false;
function scheduleSync(ms) {
  if (!S.sync.url) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, ms == null ? 1500 : ms);
}
async function api(action, body) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(S.sync.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ key: S.sync.key, action: action }, body || {})),
      signal: ctl.signal,
      redirect: 'follow'
    });
    const txt = await r.text();
    let j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('回應不是資料：請確認網址結尾是 /exec，且部署存取權限是「任何人」'); }
    if (!j.ok) throw new Error(j.error || '後端回報錯誤');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('連線逾時');
    if (e instanceof TypeError) throw new Error('連不上（沒網路，或網址不對）');
    throw e;
  } finally { clearTimeout(t); }
}
const CLOUD_FIELDS = ['id', 'url', 'norm', 'title', 'src', 'thumb', 'tags', 'seen', 'note', 'savedAt', 'seenAt', 'updatedAt', 'deleted'];
async function syncNow() {
  if (!S.sync.url || !S.sync.key) return;
  if (!navigator.onLine) { renderSync(); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  renderSync();
  const sent = {};
  const items = S.sync.dirty.map(id => byId(id)).filter(Boolean).map(it => {
    sent[it.id] = it.updatedAt;
    const o = {};
    CLOUD_FIELDS.forEach(k => { o[k] = it[k]; });
    return o;
  });
  const settings = S.sync.dirtySet.filter(k => S.shared[k]).map(k => ({ key: k, value: S.shared[k].value, updatedAt: S.shared[k].updatedAt }));
  const sentSet = settings.map(s => s.key);
  try {
    const j = await api('sync', { since: S.sync.since, items: items, settings: settings });
    S.sync.dirty = S.sync.dirty.filter(id => { const it = byId(id); return !(it && sent[id] === it.updatedAt); });
    S.sync.dirtySet = S.sync.dirtySet.filter(k => sentSet.indexOf(k) < 0);
    let changed = false;
    (j.items || []).forEach(x => {
      const cur = byId(x.id);
      if (cur && (cur.updatedAt || 0) > (x.updatedAt || 0)) return;
      if (cur && S.sync.dirty.indexOf(x.id) >= 0) return;
      const i = S.items.findIndex(y => y.id === x.id);
      if (i < 0) S.items.push(x); else S.items[i] = Object.assign({}, S.items[i], x);
      changed = true;
    });
    (j.settings || []).forEach(x => {
      const cur = S.shared[x.key];
      if (cur && (cur.updatedAt || 0) > (x.updatedAt || 0)) return;
      if (x.value == null) return;
      S.shared[x.key] = { value: x.value, updatedAt: x.updatedAt };
      changed = true;
    });
    S.sync.since = j.now;
    S.sync.lastOk = now();
    S.sync.lastErr = '';
    persistSync();
    if (changed) { persistItems(); save('tt_shared', S.shared); }
    if (!SHEET && (changed || !ONB.done)) render(); else renderSync();
    if (changed) checkNudge();
    runMetaQueue();
  } catch (e) {
    S.sync.lastErr = e.message;
    persistSync();
    renderSync();
  } finally {
    syncing = false;
    if (syncAgain || S.sync.dirty.length) { syncAgain = false; if (S.sync.dirty.length) scheduleSync(4000); }
  }
}
function syncSummary() {
  const sy = S.sync;
  if (!sy.url) return '目前只存在這台裝置。';
  if (sy.lastErr) return '同步失敗：' + sy.lastErr;
  if (!navigator.onLine) return '離線中，連上網路後自動同步（' + sy.dirty.length + ' 筆等待中）。';
  if (sy.dirty.length || sy.dirtySet.length) return '有 ' + (sy.dirty.length + sy.dirtySet.length) + ' 筆等待同步。';
  return sy.lastOk ? '已同步（' + fmtWhen(sy.lastOk) + '）' : '還沒同步過。';
}
function renderSync() {
  const sy = S.sync, dot = $('#syncDot'), txt = $('#syncText');
  dot.className = 'dot';
  if (!sy.url) { txt.textContent = '只存本機'; }
  else if (syncing) { dot.classList.add('wait'); txt.textContent = '同步中'; }
  else if (sy.lastErr) { dot.classList.add('bad'); txt.textContent = '同步失敗'; }
  else if (!navigator.onLine) { dot.classList.add('wait'); txt.textContent = '離線'; }
  else if (sy.dirty.length || sy.dirtySet.length) { dot.classList.add('wait'); txt.textContent = '待同步 ' + (sy.dirty.length + sy.dirtySet.length); }
  else { dot.classList.add('ok'); txt.textContent = '已同步'; }
  const m = $('#connMsg');
  if (m) m.textContent = syncSummary();
}

/* ---------- 抓標題 ---------- */
let metaQ = [], metaRunning = false;
function queueMeta(id) {
  if (S.metaTried[id] || metaQ.indexOf(id) >= 0) return;
  metaQ.push(id);
  setTimeout(runMetaQueue, 300);
}
async function runMetaQueue() {
  if (metaRunning || !S.sync.url || !navigator.onLine) return;
  live().forEach(it => { if (!it.title && !S.metaTried[it.id] && metaQ.indexOf(it.id) < 0) metaQ.push(it.id); });
  if (!metaQ.length) return;
  metaRunning = true;
  try {
    while (metaQ.length && navigator.onLine) {
      const id = metaQ.shift();
      const it = byId(id);
      if (!it || it.deleted) continue;
      S.metaTried[id] = 1;
      save('tt_meta', S.metaTried);
      try {
        const j = await api('meta', { url: it.url });
        const m = j.meta || {};
        const cur = byId(id);
        const patch = {};
        if (m.title && !GENERIC_TITLE.test(m.title) && !cur.title) patch.title = m.title;
        if (m.thumb && !cur.thumb) patch.thumb = m.thumb;
        if (Object.keys(patch).length) {
          patchItem(id, patch, true);
          const st = $('#shTitle');
          if (st && SHARE && SHARE.id === id && patch.title) {
            st.textContent = patch.title;
            const nm = $('#shName');
            if (nm && !nm.value.trim() && document.activeElement !== nm) nm.remove();
          }
          if (!SHEET) render();
        }
      } catch (e) { /* 抓不到就算了，之後可手動補 */ }
      await new Promise(r => setTimeout(r, 900));
    }
  } finally { metaRunning = false; }
}

/* ================= 全域事件 ================= */
$$('.tabbar button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$('#syncBtn').addEventListener('click', () => go('settings'));
$('#granQ').addEventListener('input', e => { S.gran.q = e.target.value; S.gran.limit = 60; renderGranary(); });
$('#snackTodo').addEventListener('click', () => { S.snack.todo = !S.snack.todo; S.snack.cur = ''; renderSnack(); });
$('#snackOld').addEventListener('click', () => { S.snack.old = !S.snack.old; S.snack.cur = ''; renderSnack(); });

document.addEventListener('click', async e => {
  const t = e.target;
  let b;
  if ((b = t.closest('[data-gl1]'))) { S.gran.l1 = b.dataset.gl1; S.gran.l2 = ''; S.gran.limit = 60; renderGranary(); return; }
  if ((b = t.closest('[data-gl2]'))) { S.gran.l2 = b.dataset.gl2; S.gran.limit = 60; renderGranary(); return; }
  if ((b = t.closest('[data-gst]'))) { S.gran.status = b.dataset.gst; S.gran.limit = 60; renderGranary(); return; }
  if (t.closest('#granSort')) { S.gran.sort = S.gran.sort === 'new' ? 'old' : 'new'; renderGranary(); return; }
  if ((b = t.closest('[data-sl1]'))) { S.snack.l1 = b.dataset.sl1; S.snack.cur = ''; renderSnack(); return; }
  if ((b = t.closest('[data-pref]'))) {
    S.pref[b.dataset.pref] = b.dataset.val;
    save('tt_pref', S.pref);
    if (b.dataset.pref === 'theme') applyTheme();
    renderSettings();
    return;
  }
  if ((b = t.closest('[data-tg]')) && !t.closest('.sheet')) { tagAction(b.dataset.tg, Number(b.dataset.i), Number(b.dataset.j)); return; }
  b = t.closest('[data-act]');
  if (!b || t.closest('.sheet')) return;
  const act = b.dataset.act;
  if (act === 'org') openOrganize(b.dataset.id);
  else if (act === 'add') openAdd();
  else if (act === 'onb') { if (b.getAttribute('aria-disabled') !== 'true') onbAction(b.dataset.k); }
  else if (act === 'onbX') { ONB.done = true; saveOnb(); render(); toast('收起來了'); }
  else if (act === 'nudgeGo') { NUDGE = 0; Object.assign(S.snack, { l1: '', todo: true, old: true, cur: '' }); go('snack'); }
  else if (act === 'nudgeX') { NUDGE = 0; render(); }
  else if (act === 'more') { S.gran.limit += 60; renderGranary(); }
  else if (act === 'reroll') { snackPick(true); renderSnack(); }
  else if (act === 'eat') openLink(b.dataset.id);
  else if (act === 'changelog') openChangelog();
  else if (act === 'saveConn') {
    S.sync.url = $('#setUrl').value.trim();
    S.sync.key = $('#setKey').value.trim();
    S.sync.lastErr = '';
    if (S.sync.url && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(S.sync.url)) {
      toast('網址看起來不對，應該是 https://script.google.com/macros/s/…/exec');
    }
    S.sync.since = 0;
    S.sync.dirty = [...new Set(S.sync.dirty.concat(live().map(x => x.id)))];
    persistSync();
    if (!S.sync.url) { renderSettings(); renderSync(); toast('已改回只存本機'); return; }
    $('#connMsg').textContent = '測試中…';
    try {
      const j = await api('ping');
      toast('連上了（後端 v' + j.version + '），開始同步');
      syncNow();
    } catch (err) {
      S.sync.lastErr = err.message; persistSync();
      $('#connMsg').textContent = '連不上：' + err.message;
      renderSync();
    }
  }
  else if (act === 'syncNow') { S.sync.lastErr = ''; syncNow(); }
  else if (act === 'impPreview') {
    const urls = extractUrls($('#impText').value);
    const uniq = [...new Set(urls.map(normUrl))];
    const have = uniq.filter(n => live().some(x => x.norm === n)).length;
    IMP = urls;
    if (!urls.length) { $('#impMsg').textContent = '找不到連結（要以 http 開頭）'; return; }
    $('#impMsg').innerHTML = '找到 ' + uniq.length + ' 個連結' + (have ? '，其中 ' + have + ' 個已經存過' : '') +
      '。<button type="button" class="btn leaf" style="margin-top:8px;display:block" data-act="impGo">匯入 ' + (uniq.length - have) + ' 則到待整理</button>';
  }
  else if (act === 'impGo') { importUrls(IMP); IMP = []; $('#impText').value = ''; $('#impMsg').textContent = ''; }
  else if (act === 'export') exportBackup();
  else if (act === 'wipe') {
    const ok = await askConfirm('清除這台裝置的資料？', '這台裝置上的 ' + live().length + ' 則收藏、標籤與設定都會清掉。' + (S.sync.url ? '雲端試算表裡的不會被刪，之後重新填網址就能同步回來。' : '<b>你沒有設定雲端，清掉就找不回來了，建議先匯出備份。</b>'), '清除', true);
    if (!ok) return;
    ['tt_items', 'tt_shared', 'tt_pref', 'tt_sync', 'tt_recent', 'tt_meta', 'tt_last', 'tt_onb', 'tt_nudge'].forEach(k => localStorage.removeItem(k));
    location.reload();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'impFile' && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; }
});

function openChangelog() {
  sheet('<h3>囤囤の森 v' + APP_VERSION + ' 更新內容</h3>' +
    CHANGELOG.map(c => '<div><b style="font-size:14px">v' + c.v + '（' + c.d + '）</b><ul style="margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.7;color:var(--muted)">' +
      c.lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul></div>').join('') +
    '<button type="button" class="btn" data-sh="close">好</button>');
}
function applyTheme() {
  const t = S.pref.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const night = getComputedStyle(document.documentElement).getPropertyValue('--night').trim();
  $('meta[name="theme-color"]').setAttribute('content', night || '#23314F');
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    checkReturn();
    checkNudge();
    scheduleSync(300);
  }
});
window.addEventListener('online', () => { renderSync(); scheduleSync(300); });
window.addEventListener('offline', renderSync);
setInterval(() => { if (document.visibilityState === 'visible') scheduleSync(0); }, 120000);

/* ================= 開始 ================= */
(function start() {
  $('#verBtn').textContent = 'v' + APP_VERSION;
  applyTheme();
  const params = new URLSearchParams(location.search);
  const incoming = params.has('url') || params.has('text') || params.has('title');
  if (incoming) history.replaceState(null, '', location.pathname);
  if (incoming && IS_POPUP) { popupArmed = true; lastToast = ''; }
  go(S.pref.home === 'granary' && !incoming ? 'granary' : 'inbox');
  if (incoming) handleIncoming(params);
  else { checkReturn(); checkNudge(); }
  if (S.sync.url) scheduleSync(500);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { /* 本機開檔時沒有 SW，照常可用 */ });
})();
</script>
